model_name_or_path: meta-llama/Llama-3.1-8B-Instruct
stage: sft
do_train: true
do_eval: true

dataset_dir: lora
dataset: l13_smoke_train
eval_dataset: l13_smoke_val
template: llama3
cutoff_len: 1024

finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05

learning_rate: 0.0002
num_train_epochs: 1
max_steps: 8
per_device_train_batch_size: 1
gradient_accumulation_steps: 1

bf16: true
gradient_checkpointing: true
seed: 1
logging_steps: 1
save_steps: 8
save_total_limit: 1
output_dir: lora/output_l13_lora_smoke
overwrite_output_dir: true
